<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SyncEvent – Plataforma inteligente de gestión de eventos, inscripciones, asistencia y certificados." />
  <title>SyncEvent – Gestión de Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Modo oscuro automático: se activa a las 18:30 y vuelve a claro a las 06:30 -->
  <script>
    (function () {
      var STORAGE_KEY = 'syncevent_theme';
      var DARK_START_MINUTES = 18 * 60 + 30; // 18:30 (6:30 pm)
      var DARK_END_MINUTES = 6 * 60 + 30;    // 06:30 (6:30 am)
      var root = document.documentElement;

      function getMode() {
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored === 'light' || stored === 'dark' || stored === 'auto') return stored;
        } catch (e) { /* almacenamiento no disponible */ }
        return 'auto';
      }

      function isNightTime() {
        var now = new Date();
        var minutes = now.getHours() * 60 + now.getMinutes();
        // Si el rango cruza la medianoche (18:30 -> 06:30)
        if (DARK_START_MINUTES > DARK_END_MINUTES) {
          return minutes >= DARK_START_MINUTES || minutes < DARK_END_MINUTES;
        }
        return minutes >= DARK_START_MINUTES && minutes < DARK_END_MINUTES;
      }

      function resolveTheme(mode) {
        if (mode === 'light' || mode === 'dark') return mode;
        return isNightTime() ? 'dark' : 'light';
      }

      function applyTheme() {
        var mode = getMode();
        root.setAttribute('data-theme', resolveTheme(mode));
        root.setAttribute('data-theme-mode', mode);
      }

      // Se aplica antes de renderizar para evitar el destello de tema claro.
      applyTheme();
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
