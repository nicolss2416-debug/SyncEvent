spring.application.name=syncevent
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncevent}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.issuer=syncevent-api
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT30M}
app.auth.jwt.idle-timeout=${JWT_IDLE_TIMEOUT:PT30M}
app.auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
