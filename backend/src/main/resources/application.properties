spring.application.name=syncevent
server.port=${SERVER_PORT:8080}

# ── DataSource ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncevent_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:fabrica2024*}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ── JPA / Hibernate ──────────────────────────────
# Flyway manages the schema; Hibernate should NOT recreate tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ───────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── GraphQL ─────────────────────────────────────
spring.graphql.graphiql.enabled=true
spring.graphql.websocket.path=/graphql-ws
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS

# ── Security / JWT ───────────────────────────────
app.auth.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.auth.jwt.issuer=syncevent-api
app.auth.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT30M}
app.auth.jwt.idle-timeout=${JWT_IDLE_TIMEOUT:PT30M}
app.auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@syncevent.com}
app.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin2024*}

# ── Actuator (smoke test) ────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
