spring.application.name=syncevent
server.port=${SERVER_PORT:8080}

# ===== Base de datos (PostgreSQL) =====
# Los valores por defecto permiten ejecutar en local con la base creada por
# database/init.sql. En otros entornos se sobrescriben con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncevent}
spring.datasource.username=${DB_USER:syncevent}
spring.datasource.password=${DB_PASSWORD:syncevent}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# El esquema se gestiona exclusivamente con migraciones Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
